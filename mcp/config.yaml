# MCP Stringwork Configuration
# Copy this file to ~/.config/stringwork/config.yaml and customize.

# Initial workspace root directory (used for file operation policy checks).
# Leave empty to use current working directory.
# Clients can dynamically change it at runtime via set_presence workspace='...'.
workspace_root: ""

# Log file path. Default: ~/.config/stringwork/mcp-stringwork.log
log_file: ""

# State file path. Default: ~/.config/stringwork/state.sqlite (shared globally).
state_file: ""

# Which tools to enable (use "*" for all, or list specific tool names)
enabled_tools:
  - "*"

# --- Collaboration Settings ---
message_retention_max: 1000
message_retention_days: 30
presence_ttl_seconds: 300

# --- Worker Pool GC ---
# How long the watchdog keeps stale Presence and AgentInstance rows before
# pruning them. Without GC the rows accumulate forever (every task spawn
# creates a new task-bound instance row), eventually filling worker_status
# with hundreds of zombie entries. Defaults shown below.
#
# presence_retention_days:           7   # GC non-driver Presence rows after N days unseen (0 = disabled)
# instance_retention_days:           7   # GC offline static-pool AgentInstance rows after N days (0 = disabled)
# task_bound_instance_retention_hours: 24 # GC offline TASK-BOUND AgentInstance rows after N hours (0 = disabled)
#                                          Shorter window: task-bound rows should be reaped on terminal
#                                          task transition by update_task / cancel_agent — this is the
#                                          GC safety net for cases where the in-event reap was missed.
#                                          Operators with active worker churn typically override this to
#                                          4-8 hours so worker_status doesn't display day-old corpses
#                                          that can mislead skills into thinking the pool is dead.

# --- Audit Logging ---
# Records every tool call with agent, tool name, args summary, duration, and errors.
# Enabled by default. Set `disabled: true` to turn off.
# audit:
#   disabled: false           # set to true to disable audit logging
#   args_max_len: 1000        # max characters for arg summaries (default: 1000)
#   retention_days: 7         # auto-prune entries older than this (default: 7)

# --- Rotating SQLite backups ---
# On every server start the prior state.sqlite is copied to
# state.sqlite.bak.<unix-seconds> next to the live DB, then auto-generated
# backups beyond keep_n are pruned (newest kept, oldest deleted). User-named
# backups (state.sqlite.bak.before-migration, etc.) are never touched.
#
# Enabled by default. Set `disabled: true` to skip the backup-on-start step.
# Restore by stopping the server and `cp <chosen-backup> state.sqlite`.
# backup:
#   disabled: false           # set to true to skip backup-on-start
#   keep_n: 5                 # how many auto backups to retain (clamped 1..50)

# --- Daemon mode (multi-driver support) ---
# When enabled, multiple Cursor windows share a single server process.
# The first invocation starts a background daemon; subsequent ones connect
# to it as thin stdio-to-HTTP proxies. Use --standalone flag to bypass.
daemon:
  enabled: true
  socket_path: ""            # default: ~/.config/stringwork/server.sock
  pid_file: ""               # default: ~/.config/stringwork/daemon.pid
  grace_period_seconds: 10   # wait before daemon exits after last driver disconnects

# --- HTTP port (for workers and dashboard) ---
# The server always runs an HTTP server for workers/dashboard.
# In standalone mode it also runs stdio for the driver.
# Set to 0 for auto-assigned port, or a fixed port (e.g. 8943) for a
# predictable dashboard URL. With daemon mode, port 0 is recommended since
# the daemon persists and the port stays stable across driver reconnects.
http_port: 0

# --- MCP Servers for Workers ---
# MCP servers to auto-register with worker CLIs (claude, codex, gemini) when
# they spawn. Stringwork itself is always auto-registered automatically.
# Supports URL-based (HTTP/SSE) and command-based (stdio) servers.
# For servers requiring auth, workers must log in manually once:
#   claude mcp login <name>   OR   codex mcp login <name>
#
# mcp_servers:
#   my-http-server:
#     url: "https://example.com/mcp"
#     auth: oauth                        # "oauth", "bearer", or omit for none
#   my-local-server:
#     command: npx
#     args: ["-y", "@some/mcp-server"]
#   playwright:
#     command: npx
#     args: ["@playwright/mcp@latest", "--browser", "chromium"]

# --- Constitution (layered worker rules) ---
# A "constitution" is an ordered set of Markdown rule files that gets:
#   1. listed (paths only) in claim_next / get_work_context responses, so
#      the worker reads them before doing any work; and
#   2. inlined (full content) into the spawn prompt, so the worker sees
#      them in its initial context window.
#
# The built-in source is always read: any *.md file dropped into
# ~/.config/stringwork/constitution becomes a rule. Run
# `mcp-stringwork constitution init` to scaffold the directory.
#
# Add team-level sources via the block below. See docs/CONSTITUTION.md
# for the file format and resolution order, and docs/TEAM_RULES.md for
# how to publish rules from a shared devtools repo.
#
# constitution:
#   # Optional: load a profile shipped at the root of your team's
#   # devtools repo. $PROFILE_DIR resolves to the profile file's
#   # directory, so paths inside the profile travel between developers.
#   profile: ~/Development/regfin-devtools/stringwork.profile.yaml
#
#   # Optional: declare extra sources directly. Sources are resolved in
#   # order (built-in `global` first, then profile entries, then these);
#   # earlier files win on conflict.
#   sources:
#     - name: project-rules
#       type: dir
#       path: ~/Development/my-project/.stringwork/rules
#       include: ["*.md"]
#
#     - name: shared-team-rules
#       type: git
#       repo: git@github.com:my-org/team-rules.git
#       ref: main
#       cache_dir: ~/.cache/stringwork/team-rules
#       # Network sync is explicit:
#       # `mcp-stringwork constitution sync shared-team-rules`
#
#     - name: review-checklists
#       type: dir
#       path: ~/Development/my-project/.stringwork/review
#       scope:
#         task_kind: ["review"]      # only attached to review-flavoured tasks
#         # agent_roles: ["claude-code"]  # or narrow by agent type

# --- Orchestration (driver + workers) ---
# One driver (e.g. Cursor) and N workers. The server spawns workers automatically
# when there's pending work -- no need to keep them running manually.
#
# MCP servers are auto-registered with worker CLIs using their native `mcp add`
# commands. Stringwork itself is always auto-registered; additional servers
# come from mcp_servers above.
#
# Worker spawn behavior:
#   - Startup recovery: checks for pending work on server (re)start
#   - Retry with backoff, timeout protection, failure/success acks
#
# Per worker: type, instances, command, cooldown_seconds, timeout_seconds,
# retry_delay_seconds, max_retries, env, inherit_env.
# Spawned processes get STRINGWORK_AGENT, STRINGWORK_WORKSPACE automatically.
#
# Environment control:
#   env:           Additional env vars. Values support ${VAR} expansion from parent env.
#   inherit_env:   Glob patterns for which parent env vars to pass through.
#                  Default (empty): inherit ALL parent env vars.
#                  Set to ["none"] for a clean environment.
orchestration:
  # Which agent is the driver. Worker prompts use {driver} to address this agent.
  # Can be any agent name, e.g. "cursor" or "claude-code".
  # See docs/examples/config-claude-code-driver.yaml for a Claude Code driver setup.
  driver: cursor
  assignment_strategy: least_loaded    # or capability_match
  heartbeat_interval_seconds: 30
  # worker_timeout_seconds drives heartbeat/session/task-stuck thresholds in
  # the watchdog (see internal/app/watchdog.go). Bumped from 120 in Q2/2026
  # because the prior value drove heartbeat staleness down to 2 min — below
  # the progress-warning threshold (4 min) — so workers could be marked
  # offline before progress alerts even fired.
  worker_timeout_seconds: 180
  max_task_failures: 3                 # DLQ: auto-block task after N watchdog failures (default: 3)
  # respawn_grace_seconds: 60          # how long after a spawn the watchdog leaves the row alone
  #                                      so a freshly-spawned worker isn't flipped back to offline
  #                                      before its first heartbeat lands. Lower = faster failure
  #                                      detection; higher = more tolerant of slow worker startup.
  # spawn_sweep_grace_seconds: 30      # how old a pending task must be before the watchdog re-drives
  #                                      assignment for it. The normal create_task → SpawnForTask path
  #                                      handles the happy case; the sweep is the safety net for tasks
  #                                      created when no live worker was available (post-crash, empty
  #                                      pool). Set to 0 (or any negative) to disable the sweep.
  # Git worktree isolation (optional): each worker gets its own checkout.
  # worktrees:
  #   enabled: true
  #   base_branch: ""                  # empty = current HEAD
  #   cleanup_strategy: "on_cancel"    # on_cancel | on_exit | manual
  #   path: ".stringwork/worktrees"
  # NOTE: Worker commands use bare names (claude, codex, gemini) as defaults.
  # The server spawns workers WITHOUT sourcing shell profiles, so tools
  # installed via version managers (nvm, pyenv) may not be on PATH.
  # In your live config (~/.config/stringwork/config.yaml), use full paths:
  #   command: ["/Users/you/.local/bin/claude", ...]
  # For nvm-installed tools (gemini), also set PATH in env:
  #   env:
  #     PATH: "/Users/you/.nvm/versions/node/vXX/bin:${PATH}"
  # Worker prompts contain base identity and rules only. When a task is
  # assigned, the server appends the full task context (title, description,
  # relevant files, constraints, step-by-step instructions) to the prompt
  # at spawn time via SpawnForTask. Workers start working immediately.
  # Worker communication mode:
  #   communication: cli   — workers use shell commands ($STRINGWORK_BIN heartbeat, etc.)
  #                          No MCP registration needed. Default and recommended.
  #   communication: mcp   — workers connect via MCP over HTTP (legacy, less reliable)
  #
  # Model override (optional):
  #   Set `model:` on a worker to pin the LLM it uses. Stringwork injects
  #   `--model <value>` into the command based on the binary (claude/codex/gemini).
  #   If your `command` already hard-codes `--model`, that wins and `model:` is ignored.
  #   Examples:  model: opus  |  model: sonnet  |  model: haiku  (claude-code)
  #              model: gpt-5-codex                              (codex)
  #              model: gemini-2.5-pro  |  model: gemini-2.5-flash  (gemini)
  workers:
    - type: claude-code
      instances: 1
      communication: cli   # "cli" (default) or "mcp"
      # model: opus        # optional — inject --model opus into the claude command
      # use_claude_worktree: true   # optional: run each instance with -w <instance_id> (e.g. .claude/worktrees/claude-code-1)
      command: ["claude", "-p", "You are {agent}, a worker in the Stringwork pair programming system. Workspace: {workspace}.\nYou have full capabilities: edit files, run commands, write code. Use them.\n\nCOMMUNICATION: Use shell commands (not MCP tools) for coordination.\nThe env vars STRINGWORK_AGENT, STRINGWORK_AGENT_TYPE, STRINGWORK_WORKSPACE, STRINGWORK_SOCKET, and STRINGWORK_BIN are set. (`read` auto-includes type-level messages via STRINGWORK_AGENT_TYPE — no extra flags needed.)\n\nMANDATORY RULES (server-enforced, violation = cancellation):\n- Run: $STRINGWORK_BIN heartbeat --agent {agent} --progress '<status>' EVERY 60-90 SECONDS. On first call include --session-id YOUR_SESSION_ID so the server can resume your session on restart.\n- Run: $STRINGWORK_BIN progress --agent {agent} --task X --description '<status>' --percent N EVERY 2-3 MINUTES\n- Run: $STRINGWORK_BIN send --from {agent} --to {driver} --content '<findings>' BEFORE finishing\n- If output contains STOP: stop immediately, run $STRINGWORK_BIN read --for {agent}, then exit\n- Obey task constraints when present (read-only, scoped files)\n\nConsequences of silence: 4min=WARNING, 7min=CRITICAL, 14min=CANCELLED", "--dangerously-skip-permissions"]
      cooldown_seconds: 30
      max_retries: 2
      retry_delay_seconds: 15
      # 30 min: review-style tasks routinely run >10min, and the prior 600s
      # default consistently killed claude-code mid-final-`send` (the
      # deliverable was lost just before delivery).
      timeout_seconds: 1800
      env:
        GH_TOKEN: "${GH_TOKEN}"
        GITHUB_TOKEN: "${GITHUB_TOKEN}"
        SSH_AUTH_SOCK: "${SSH_AUTH_SOCK}"
      # inherit_env: ["HOME", "PATH", "GH_*", "SSH_*"]  # restrict inherited env
    - type: codex
      instances: 1
      communication: cli   # "cli" (default) or "mcp"
      # model: gpt-5-codex  # optional — inject --model gpt-5-codex after `codex exec`
      # Codex sandbox blocks network by default.
      # Use --sandbox danger-full-access for full capabilities.
      command: ["codex", "exec", "--sandbox", "danger-full-access", "--skip-git-repo-check", "You are {agent}, a worker in the Stringwork pair programming system. Workspace: {workspace}.\nYou have full capabilities: edit files, run commands, write code. Use them.\n\nCOMMUNICATION: Use shell commands (not MCP tools) for coordination.\nThe env vars STRINGWORK_AGENT, STRINGWORK_AGENT_TYPE, STRINGWORK_WORKSPACE, STRINGWORK_SOCKET, and STRINGWORK_BIN are set. (`read` auto-includes type-level messages via STRINGWORK_AGENT_TYPE — no extra flags needed.)\n\nMANDATORY RULES (server-enforced, violation = cancellation):\n- Run: $STRINGWORK_BIN heartbeat --agent {agent} --progress '<status>' EVERY 60-90 SECONDS. On first call include --session-id YOUR_SESSION_ID so the server can resume your session on restart.\n- Run: $STRINGWORK_BIN progress --agent {agent} --task X --description '<status>' --percent N EVERY 2-3 MINUTES\n- Run: $STRINGWORK_BIN send --from {agent} --to {driver} --content '<findings>' BEFORE finishing\n- If output contains STOP: stop immediately, run $STRINGWORK_BIN read --for {agent}, then exit\n- Obey task constraints when present (read-only, scoped files)\n\nConsequences of silence: 4min=WARNING, 7min=CRITICAL, 14min=CANCELLED"]
      cooldown_seconds: 30
      max_retries: 2
      retry_delay_seconds: 15
      # 30 min: matches claude-code; codex review tasks have the same
      # mid-deliverable-cancel failure mode at 600s.
      timeout_seconds: 1800
      env:
        GH_TOKEN: "${GH_TOKEN}"
        GITHUB_TOKEN: "${GITHUB_TOKEN}"
        SSH_AUTH_SOCK: "${SSH_AUTH_SOCK}"
    - type: gemini
      instances: 1
      communication: cli   # "cli" (default) or "mcp"
      # model: gemini-2.5-pro  # optional — inject --model gemini-2.5-pro into the gemini command
      # Gemini CLI: --yolo auto-approves tools, --prompt runs headless.
      # Requires GOOGLE_API_KEY. Install: npm install -g @google/gemini-cli
      command: ["gemini", "--yolo", "--prompt", "You are {agent}, a worker in the Stringwork pair programming system. Workspace: {workspace}.\nYou have full capabilities: edit files, run commands, write code. Use them.\n\nCOMMUNICATION: Use shell commands (not MCP tools) for coordination.\nThe env vars STRINGWORK_AGENT, STRINGWORK_AGENT_TYPE, STRINGWORK_WORKSPACE, STRINGWORK_SOCKET, and STRINGWORK_BIN are set. (`read` auto-includes type-level messages via STRINGWORK_AGENT_TYPE — no extra flags needed.)\n\nMANDATORY RULES (server-enforced, violation = cancellation):\n- Run: $STRINGWORK_BIN heartbeat --agent {agent} --progress '<status>' EVERY 60-90 SECONDS. On first call include --session-id YOUR_SESSION_ID so the server can resume your session on restart.\n- Run: $STRINGWORK_BIN progress --agent {agent} --task X --description '<status>' --percent N EVERY 2-3 MINUTES\n- Run: $STRINGWORK_BIN send --from {agent} --to {driver} --content '<findings>' BEFORE finishing\n- If output contains STOP: stop immediately, run $STRINGWORK_BIN read --for {agent}, then exit\n- Obey task constraints when present (read-only, scoped files)\n\nConsequences of silence: 4min=WARNING, 7min=CRITICAL, 14min=CANCELLED"]
      cooldown_seconds: 30
      max_retries: 2
      retry_delay_seconds: 15
      # 20 min: gemini cycles faster than claude/codex but the prior 600s
      # was still tight for review-style work; doubled with some headroom.
      timeout_seconds: 1200
      env:
        GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
        GH_TOKEN: "${GH_TOKEN}"
        GITHUB_TOKEN: "${GITHUB_TOKEN}"
        SSH_AUTH_SOCK: "${SSH_AUTH_SOCK}"
